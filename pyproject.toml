[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lnpl-postgres"
version = "0.1.0"
description = "PostgreSQL RepositoryDriver for lnpl (linkly#121)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "lnpl>=0.9,<0.10",
    "psycopg[binary,pool]>=3.2,<3.3",
]

[project.optional-dependencies]
test = ["testcontainers[postgres]>=4.15,<5", "packaging>=24"]

[project.entry-points."lnpl.drivers"]
postgres = "lnpl_postgres:make_driver"

[tool.setuptools]
packages = ["lnpl_postgres"]
