name: linkly-sync

# PR 게이트: 이 변경이 linkly와의 연동을 깨지 않는지 사전 체크한다.
#
# - latest-release: pyproject.toml의 lnpl 버전 범위가 PyPI의 최신 lnpl 릴리스를
#   포함하는지 확인한다(scripts/check_lnpl_range.py). linkly가 범위 밖의 새
#   마이너를 내면 여기서 실패한다 — 범위를 넓히고 그 버전으로 테스트한 뒤
#   릴리스하라는 신호다. 테스트 자체는 ci.yml이 범위 안의 최신 릴리스를 설치해
#   돌리므로, 둘이 함께 통과하면 "최신 릴리스에서 동작한다"가 성립한다.
# - latest-main: 릴리스 대신 linkly@main 최신으로 lnpl을 설치해 전체 테스트
#   (Testcontainers TCK 포함)를 돌린다 — 다음 linkly 릴리스에 들어갈 변경과도
#   호환되는지, 머지 전에 확인한다.
#
# 두 축(최신 릴리스, 최신 main)이 함께 통과해야 "지금 배포된 lnpl에서도, 다음
# lnpl에서도 동작한다"가 성립한다.

on:
  pull_request:

jobs:
  latest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install packaging
      - name: lnpl range must admit the latest lnpl release
        run: python scripts/check_lnpl_range.py pyproject.toml

  latest-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with linkly@main instead of the released lnpl
        run: |
          pip install -e ".[test]"
          pip install --upgrade --force-reinstall "lnpl @ git+https://github.com/choiyounggi/linkly@main"
          python -c "import lnpl; print('lnpl', getattr(lnpl, '__version__', '?'), 'from linkly@main')"
      - name: Run the full suite (TCK via Testcontainers) against linkly main
        run: python -m unittest discover -s tests -v
